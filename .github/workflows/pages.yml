# Builds the English and Chinese demo dashboards from the demo data and publishes them to GitHub Pages:
#   https://<user>.github.io/<repo>/      English
#   https://<user>.github.io/<repo>/zh/   Chinese
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish demo pages

on:
  push:
    branches: [main]
    paths:
      - "analysis/**"
      - "demo/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build the demo dashboards
        run: |
          python demo/generate_demo.py
          mkdir -p site/zh
          python analysis/build_dashboard.py demo --demo --no-snapshot --lang en
          cp demo/ibkr_dashboard.html site/index.html
          python analysis/build_dashboard.py demo --demo --no-snapshot --lang zh
          cp demo/ibkr_dashboard.html site/zh/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
