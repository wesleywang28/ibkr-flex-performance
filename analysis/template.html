<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IBKR Performance Dashboard</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b2232;--muted:#6b7385;--line:#e5e7ec;--acc:#1f5eff;--ibkr:#a3abbd;--spy:#f08c2e;--qqq:#16a06a;--pos:#139a4a;--neg:#d92d2d;--tax:#7c4dff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:18px}
h1{font-size:23px;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.k4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.k4{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.kpi .lab{color:var(--muted);font-size:12.5px}
.kpi .val{font-size:24px;font-weight:680;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi .note{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.hero{border-color:#cfdcff;background:linear-gradient(180deg,#f7f9ff,#fff)}
section{margin-top:26px}
h2{font-size:16.5px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.btns button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chart{position:relative;height:360px}
.chart.md{height:290px}.chart.sm{height:240px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;background:#fafbfc;position:sticky;top:0}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:none}
.two{grid-template-columns:1.25fr 1fr}
.half{grid-template-columns:1fr 1fr}
@media(max-width:900px){.two,.half{grid-template-columns:1fr}}
.callout{background:#f5f2ff;border:1px solid #e4dcff;border-radius:10px;padding:13px 15px;font-size:13.3px}
.callout b{font-weight:650}
.callout p{margin:0 0 8px}.callout p:last-child{margin:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#f6f7f9;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:130px}
.chip .lab{font-size:12px;color:var(--muted)}.chip .val{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:520px}
.xscroll{overflow-x:auto}
.dim{color:var(--muted)}
.tag{display:inline-block;padding:0 7px;border-radius:6px;font-size:11.5px;line-height:19px}
.t-out{background:#fde8e8;color:#b42318}.t-in{background:#e5f6ec;color:#11713a}.t-tax{background:#efe9ff;color:#5b34d6}
ul.ins{margin:0;padding-left:18px}ul.ins li{margin:4px 0}
.list td{padding:5px 8px}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:900px){.flags{grid-template-columns:1fr}}
.flag{border:1px solid var(--line);border-left:4px solid #9aa3b5;border-radius:8px;padding:9px 12px;background:#fff}
.flag.high{border-left-color:#d92d2d;background:#fff7f7}.flag.mid{border-left-color:#e8a317;background:#fffaf0}.flag.info{border-left-color:#7f8aa3}
.flag .t{font-weight:620;font-size:13.5px}.flag .x{color:var(--muted);font-size:12.6px;margin-top:2px}
.lv{display:inline-block;font-size:11px;padding:0 6px;border-radius:5px;margin-right:6px;line-height:18px;vertical-align:1px}
.lv.high{background:#fde2e2;color:#b42318}.lv.mid{background:#fdf0d5;color:#9a6100}.lv.info{background:#eef0f4;color:#4b5568}
tr.big td{background:#fff8e6}
.cnt{font-size:12px;font-weight:500;color:var(--muted)}
.rngsum{font-size:13px;color:var(--muted);margin:-2px 0 8px}.rngsum b{color:var(--ink);font-variant-numeric:tabular-nums}
.calnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calnav button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:28px;cursor:pointer;font-size:15px;color:var(--ink)}
.calnav button:disabled{opacity:.35;cursor:default}
.calnav .ym{font-weight:650;min-width:110px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.cal .h{font-size:12px;color:var(--muted);text-align:center}
.cal .c{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:62px;font-variant-numeric:tabular-nums;overflow:hidden}
.cal .c .d{font-size:12px;color:var(--muted)}
.cal .c .r{font-size:14px;font-weight:650;margin-top:1px}
.cal .c .p{font-size:12px}
.cal .c.fut{background:#fafbfc}.cal .c.off{background:#f4f5f7;color:var(--muted);font-size:12px}.cal .c.blank{border:none;background:none}
footer{margin-top:34px;color:var(--muted);font-size:12.3px}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details summary{cursor:pointer;color:var(--ink);font-weight:600}
details li{margin:4px 0}
details.fold{border:none;border-radius:0;padding:0;background:none;margin-top:12px}
details.fold>summary{font-weight:500;color:var(--muted);font-size:12.5px;margin-bottom:6px}
.comp{margin:4px 0 14px}.comp .t{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.comp .r{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.5px}
.comp .r .k{width:64px;flex:none;color:var(--muted)}.comp .r .v{width:52px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.comp .bar{flex:1;display:flex;height:18px;background:#f1f2f5;border-radius:5px;overflow:hidden;min-width:0}
.comp .bar span{display:block;height:100%}
.comp .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.comp .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media(max-width:600px){.wrap{padding:16px 10px 40px}.card{padding:14px 12px}.kpi .val{font-size:20px}th,td{padding:6px 7px}
.cal .c{padding:4px 5px;min-height:54px}.cal .c .r{font-size:12.5px}.cal .c .p{font-size:11px}}
@media(max-width:600px){#tPos th:nth-child(2),#tPos td:nth-child(2){display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>/*__CHARTJS__*/</script>
<script>
const D = /*__DATA__*/;
const S = D.series, K = D.kpi, B = D.bench, M = D.meta;
const hasB = s => Array.isArray(S[s]);
const EV_DEP = 'Deposit', EV_WD = 'Withdrawal', EV_TAX = 'Temp. withholding', EV_REF = 'Withholding refund';

/* ---------- formatting ---------- */
const CCY = ({USD: '$', EUR: '€', GBP: '£', JPY: '¥', CNH: '¥', CNY: '¥', HKD: 'HK$', SGD: 'S$', CAD: 'C$', AUD: 'A$', CHF: 'CHF '})[M.currency] ?? ((M.currency || '') + ' ');
const money = (v, dp = 0, sign = false) => v == null ? '—' :
  (v < 0 ? '-' : (sign && v > 0 ? '+' : '')) + CCY + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits: dp, maximumFractionDigits: dp});
const pct = (v, dp = 2, sign = true) => v == null ? '—' : ((sign && v > 0) ? '+' : '') + (v * 100).toFixed(dp) + '%';
const num = (v, dp = 2) => v == null ? '—' : v.toFixed(dp);
const cls = v => v == null ? '' : (v >= 0 ? 'pos' : 'neg');
const md = s => s ? s.slice(5).replace('-', '/') : '—';
const pp = v => (v * 100).toFixed(1) + ' pp';
const evTag = k => k === EV_WD ? 't-out' : (k === EV_DEP ? 't-in' : 't-tax');

/* ---------- language (settings.json -> "language") ---------- */
const LANGS = {
  en: {
    title: 'IBKR Performance Dashboard', demo: 'demo data', generated: 'Generated',
    acct: (a, c, s, e, n) => `Account ${a} · ${c} · ${s} to ${e} (${n} trading days)`,
    latest: (e, nav, r, spy) => `Latest day ${e}: NAV ${nav}, ${r}${spy ? ` (SPY ${spy})` : ''}`,
    kTwr: 'Time-weighted return (adjusted)', kTwrNoteTax: x => `IBKR shows ${x} · excludes cash flows and temp. withholding`, kTwrNote: x => `IBKR shows ${x} · excludes deposits and withdrawals`,
    kBench: 'SPY / QQQ, same period', kBenchNote: x => `${x} vs. SPY`, noBench: 'No benchmark data',
    kPnl: 'Total P&L', kPnlNote: (n, c, pre) => `NAV ${n} − net contributions ${c}${pre ? ' (incl. starting value)' : ''}`,
    kMwr: 'Money-weighted return (Modified Dietz)', kMwrNote: (x, short) => `XIRR ${x} annualized${short ? ' (under a year; indicative only)' : ''}`,
    kNav: 'Net asset value', kNavNote: (sv, i, o) => `${sv ? `Starting value ${sv} · ` : ''}Deposits ${i} · withdrawals ${o}`,
    kMdd: 'Max drawdown', kMddNote: (a, b, rec) => `${a} → ${b}, ${rec ? 'recovered ' + rec : 'not yet recovered'}`,
    kVol: 'Annualized volatility / Sharpe', kVolNote: (sv, so) => `SPY volatility ${sv} · Sortino ${so}`,
    kBest: 'Best / worst day', kBestNote: (a, b, up) => `${a} / ${b} · up days ${up}`,
    risk: 'Risk flags', riskHint: 'Rule-based and descriptive only, not investment advice. Thresholds are in analysis/settings.json.',
    lv: {high: 'High', mid: 'Medium', info: 'Info'}, riskCnt: (h, m) => `high ${h} · medium ${m}`, noFlags: 'No risk rules are triggered right now.',
    cum: 'Cumulative return', cumHint: 'Time-weighted, rebased to zero · click the legend to toggle lines · ▲ marks cash flows and withholdings',
    rng: {all: 'All', '3m': '3M', '1m': '1M', ytd: 'YTD'},
    rngSum: (a, b, r, p, spy, qqq) => `${a} to ${b}: return ${r} · P&L ${p}${spy ? ` · SPY ${spy}` : ''}${qqq ? ` · QQQ ${qqq}` : ''}`,
    tipPnl: (lab, r, p) => `${lab}: ${r} (${p})`,
    myAcct: 'My account (adjusted)', myAcctShort: 'My account', ibkrRaw: 'IBKR as reported', events: 'Events', adjusted: 'Adjusted',
    cal: 'Daily returns calendar', calHint: 'Time-weighted daily return and P&L (excluding cash flows and temp. withholding)',
    calDays: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], calYm: (y, m) => new Date(y, m - 1, 1).toLocaleString('en-US', {month: 'long', year: 'numeric'}),
    calClosed: 'Closed', calSum: (n, r, p) => `${n} trading day${n === 1 ? '' : 's'} this month: return ${r} · P&L ${p}`, calNone: 'No trading days with data this month',
    why: 'Why this differs from what IBKR shows', whyWd: 'Withdrawals and your return', zoom: 'Around the withholding: IBKR vs. adjusted',
    whyTax1: (n, a, b, out, back, bd, wr, wd, br, bdd, wa, ba) => `<p><b>1. IBKR counted a temporary tax withholding as a loss.</b> From ${a} to ${b}, ${n} withholding${n === 1 ? '' : 's'} totaling ${out} were taken${back ? `, and ${back} was refunded on ${bd}` : ''}. IBKR shows <b class="neg">${wr}</b> on ${wd}${br ? ` and <b class="pos">${br}</b> on ${bdd}` : ''}, but the actual investment return on those days was ${wa}${ba ? ' and ' + ba : ''}.</p>`,
    whyTax2: (gap, gd, ddI, ddA, pend) => `<p>Under IBKR's numbers the cumulative return was understated by up to <b>${gap}</b> (${gd}) and the drawdown looked like ${ddI}; the actual max drawdown is ${ddA}. ${pend ? `${pend} has not been refunded yet and is treated as cash held back for now.` : 'The withholding has been fully refunded, so the two curves end up close together again.'}</p>`,
    whyWdP: (num_, d, amt, ri, ra, ex) => `<p><b>${num_}A withdrawal does not affect the time-weighted return.</b> On ${d} you withdrew ${amt}; IBKR's TWR for that day is ${ri} and the adjusted TWR is ${ra}, both normal.${ex}</p>`,
    whyWdEx: (lab, nb, paid, rb, na, ra) => ` If a number you watch dropped after the withdrawal, it is likely a simple "NAV ÷ ${lab}" return: before ${nb} ÷ ${paid} − 1 = ${rb}, after ${na} ÷ ${paid} − 1 = ${ra}. The drop reflects money taken out, not an investment loss.`,
    paidStart: 'starting value + deposits', paidDep: 'total deposits',
    evCols: ['Date', 'Event', 'Amount', 'IBKR daily return', 'Adjusted daily return', 'NAV'],
    evName: {Deposit: 'Deposit', Withdrawal: 'Withdrawal', 'Temp. withholding': 'Temp. withholding', 'Withholding refund': 'Withholding refund'},
    style: 'Trading-style changes', styleSub: 'Latest month vs. average of earlier months (highlighted = notable change)', byMonth: 'By month',
    styleHint: (l, a, b) => `${l} vs. the ${a} to ${b} monthly average`, styleCols: ['Metric', 'Earlier avg', 'Change'],
    styleTbl: ['Month', 'Return', 'Closes', 'Win rate', 'Payoff', 'Largest loss', 'Short share', 'Hold (days)', 'Intraday', 'Turnover', 'Avg exposure', 'Max exposure', 'Largest position'],
    roll: 'Rolling metrics', rollHint: w => `Rolling ${w} trading days`, rollRet: 'Rolling return', rollVol: 'Rolling annualized volatility', rollSh: 'Rolling Sharpe',
    obs: 'Key observations', obsHint: 'Generated from the data',
    oPeriod: (a, b, r, spy, qqq, ex) => `Over the same period (${a} to ${b}) the time-weighted return was ${r} vs. SPY ${spy}${qqq ? ' and QQQ ' + qqq : ''}, an excess of about <b>${ex}</b>.`,
    oSim: (pre, se, sp, nav, pnl) => `Had ${pre ? 'the starting value and every deposit and withdrawal' : 'every deposit and withdrawal'} gone into SPY instead, the account would be worth about ${se} (P&L ${sp}); the actual account is ${nav} (P&L ${pnl}).`,
    oBeta: (b, c, low) => `Beta to SPY is ${b} with a correlation of ${c}${low ? ': the account moves largely independently of the market, so returns come mostly from stock selection and trading' : ''}.`,
    oTop: (n, list, sh, over) => over ? `Concentration of gains: the top ${n} symbols (${list}) earned more than the account's total P&L (${sh}); losses elsewhere offset part of it.` : `Concentration of gains: the top ${n} symbols (${list}) account for ${sh} of total P&L.`,
    oWin: (wr, al, larger, aw, po, worst) => `Win rate on closes is ${wr}; the average loss (${al}) is ${larger ? 'larger' : 'smaller'} than the average win (${aw}), a payoff ratio of ${po}.${worst ? ' The biggest loser is ' + worst + '.' : ''}`,
    oPace: (h, m, i, t) => `Trading pace: value-weighted average holding period ${h} days (median ${m}), ${i} of closed value was round-tripped intraday, and total traded value is ${t}× average NAV.`,
    oPos: (l, s, g, n) => `Currently long ${l} and short ${s}: gross exposure ${g}× NAV, net exposure ${n}.`,
    navC: 'NAV vs. net contributions', navHint: 'Dashed: same cash flows invested in SPY', navL: 'NAV', contribL: 'Net contributions', simL: 'Same cash flows in SPY',
    dd: 'Drawdown', ddHint: 'Decline from the running peak',
    mon: 'Monthly returns', monHint: 'Time-weighted', monCols: {m: 'Month', account: 'Account (adjusted)', ibkr: 'IBKR as reported', ex: 'Excess vs. SPY', total: 'Total'},
    comp: 'Composition (% of NAV)', compLong: 'Long', compShort: 'Short', compCls: {stk: 'Stocks', etf: 'ETFs', opt: 'Options', oth: 'Other'},
    compOpt: 'Options are shown at their market value (premium), which understates the exposure they carry.',
    evDetails: 'Event details', altLang: '中文',
    pos: 'Open positions', asOf: e => `As of ${e}`, chips: ['Long value', 'Short value', 'Cash', 'Gross exposure / NAV', 'Net exposure / NAV'],
    posCols: ['Symbol', 'Description', 'Side', 'Quantity', 'Avg cost', 'Price', 'Value', '% of NAV', 'Unrealized P&L', 'Return'], long: 'Long', short: 'Short', noPos: 'No open positions',
    expo: 'Daily long / short exposure and gross leverage', longV: 'Long value', shortV: 'Short value', grossL: 'Gross exposure / NAV',
    sym: 'P&L by symbol', symHint: 'Realized + unrealized + net dividends', symD: 'Symbol details',
    symCols: ['Symbol', 'Realized', 'Unrealized', 'Net dividends', 'Total', 'Executions', 'Traded value', 'Commissions'],
    trade: 'Trade analysis', tradeHint: 'Closing executions in the same symbol, day and direction count as one close',
    tchips: (T, comm) => [
      ['Closes', `${T.n_close ?? '—'}`, `long ${T.n_long ?? 0} · short ${T.n_short ?? 0}`],
      ['Win rate', pct(T.win_rate, 1, false), `wins ${money(T.gross_win)} / losses ${money(T.gross_loss)}`],
      ['Avg win / avg loss', `${money(T.avg_win)} / ${money(T.avg_loss)}`, `profit factor ${num(T.profit_factor)}`],
      ['Long / short P&L', `<span class="${cls(T.long_pnl)}">${money(T.long_pnl, 0, true)}</span> / <span class="${cls(T.short_pnl)}">${money(T.short_pnl, 0, true)}</span>`, 'realized'],
      ['Avg holding period', `${num(T.avg_hold_days, 1)} days`, `median ${num(T.median_hold_days, 1)} · intraday ${pct(T.intraday_share, 0, false)}`],
      ['Traded value', money(T.turnover), `${num(T.turnover_x, 1)}× avg NAV · ${T.n_exec} executions`],
      ['Commissions', money(T.commissions), `${comm} of P&L`]],
    win: 'Largest winning closes', loss: 'Largest losing closes', none: 'None', closeLong: 'Close long', coverShort: 'Cover short',
    act: 'Executions and traded value by month', execL: 'Executions', moneyL: 'Traded value', execUnit: 'executions',
    fees: 'Fees and income', feeCols: ['Item', 'Amount', '% of total P&L'], total: 'Total', feeName: {},
    meth: 'Methodology',
    methItems: rf => [
      `<b>Adjusted TWR</b>: daily return = (ending NAV − starting NAV − external cash flow) ÷ (starting NAV + that day's inflow). External cash flows are deposits, withdrawals, asset transfers and <b>temporary tax withholdings</b>: a transactionTax amount that IBKR later refunds is treated as cash temporarily leaving the account and the refund as cash coming back, so neither counts as investment P&amp;L. Transaction tax that is never refunded (e.g. stamp duty) stays in P&amp;L as a cost. Daily returns are chained.`,
      `<b>IBKR as reported</b>: IBKR's own daily TWR from the Flex report, chained. It treats a temporary withholding as a loss and the refund as a gain, so the curve drops and then jumps back.`,
      `<b>Money-weighted return</b>: Modified Dietz = total P&amp;L ÷ time-weighted average invested capital (if the account existed before the first day in the data, its NAV on that day counts as starting capital), i.e. how much your money actually earned, which depends on when you added it. XIRR is the annualized internal rate of return and is inflated for periods shorter than a year.`,
      `<b>Daily P&amp;L and the calendar</b>: daily P&amp;L = ending NAV − starting NAV − external cash flows, on the same basis as the adjusted TWR. Daily figures use official closing prices, so a trade filled after hours far from the close shows a paper gain or loss that day and reverses the next day; the cumulative total is unaffected.`,
      `<b>Benchmarks</b>: SPY and QQQ use dividend-adjusted closes, rebased to the account's start date. "Same cash flows in SPY" buys SPY on each deposit date and sells on each withdrawal date.`,
      `<b>Risk metrics</b>: volatility, Sharpe (risk-free rate ${rf}) and beta use only days after the account exceeded $5,000, to avoid noise from tiny early balances; annualized figures are unstable with less than a year of data.`,
      `<b>P&amp;L by symbol</b>: FIFO realized + current unrealized + net dividends (after withholding tax); options are grouped under their underlying.`],
    data: (n) => `Data: IBKR Flex Web Service (${n} report file${n === 1 ? '' : 's'}, merged and de-duplicated); benchmark prices from Yahoo Finance.`,
    footer: 'Generated locally from your own data for personal review. Not investment advice.',
  },
  zh: {
    title: 'IBKR 收益分析', demo: '示例数据', generated: '生成于',
    acct: (a, c, s, e, n) => `账户 ${a} · ${c} · 数据区间 ${s} 至 ${e}（${n} 个交易日）`,
    latest: (e, nav, r, spy) => `最新交易日 ${e}：净值 ${nav}，当日 ${r}${spy ? `（SPY ${spy}）` : ''}`,
    kTwr: '时间加权收益（TWR，调整后）', kTwrNoteTax: x => `IBKR 显示 ${x} · 剔除出入金和临时预扣`, kTwrNote: x => `IBKR 显示 ${x} · 剔除出入金`,
    kBench: '同期 SPY / QQQ', kBenchNote: x => `超额 SPY ${x}`, noBench: '基准数据缺失',
    kPnl: '累计盈亏', kPnlNote: (n, c, pre) => `净值 ${n} − 净投入 ${c}${pre ? '（含初始本金）' : ''}`,
    kMwr: '资金加权收益（Modified Dietz）', kMwrNote: (x, short) => `XIRR 年化 ${x}${short ? '（不足一年，仅供参考）' : ''}`,
    kNav: '当前净值', kNavNote: (sv, i, o) => `${sv ? `初始本金 ${sv} · ` : ''}入金 ${i} · 提现 ${o}`,
    kMdd: '最大回撤', kMddNote: (a, b, rec) => `${a} → ${b}，${rec ? rec + ' 已修复' : '尚未修复'}`,
    kVol: '年化波动 / 夏普', kVolNote: (sv, so) => `SPY 波动 ${sv} · Sortino ${so}`,
    kBest: '最好 / 最差交易日', kBestNote: (a, b, up) => `${a} / ${b} · 上涨日占比 ${up}`,
    risk: '风险提示', riskHint: '按规则自动生成，只描述数据，不构成投资建议；阈值可在 analysis/settings.json 调整',
    lv: {high: '高', mid: '中', info: '信息'}, riskCnt: (h, m) => `高 ${h} · 中 ${m}`, noFlags: '目前没有触发任何风险规则。',

const taxBack = taxEv.filter(e => e.amount > 0).reduce((a, e) => a + e.amount, 0);
let maxGap = 0, gapDate = null;
for (let i = 0; i < N; i++) { const g = (S.adj[i] ?? 0) - (S.ibkr[i] ?? 0); if (g > maxGap) { maxGap = g; gapDate = S.dates[i]; } }

const syms = D.syms.slice();

const top5 = syms.filter(s => s.total > 0).slice(0, 5);

const grossExpo = K.long_mv - K.short_mv;

/* ---------- key observations ---------- */

if (top5.length) ins.push(L.oTop(top5.length, top5.map(s => s.symbol).join(', '), top5Share > 1 ? money(totalSymPnl, 0, true) : (top5Share * 100).toFixed(0) + '%', top5Share > 1));

  syms.length && syms[syms.length - 1].total < 0 ? `${syms[syms.length - 1].symbol} (${money(syms[syms.length - 1].total)})` : ''));
if (T.avg_hold_days != null) ins.push(L.oPace(num(T.avg_hold_days, 1), num(T.median_hold_days, 1), pct(T.intraday_share, 0, false), num(T.turnover_x, 1)));

/* ---------- explanation ---------- */
(function () {
  const w = [];
  if (taxEv.length) {
    const outs = taxEv.filter(e => e.amount < 0), backs = taxEv.filter(e => e.amount > 0);
    const worst = outs.slice().sort((a, b) => a.ibkr - b.ibkr)[0], best = backs.slice().sort((a, b) => b.ibkr - a.ibkr)[0];
    w.push(L.whyTax1(outs.length, md(outs[0].date), md(outs[outs.length - 1].date), money(-taxOut, 2), backs.length ? money(taxBack, 2) : '', backs.length ? md(backs[0].date) : '',
      pct(worst.ibkr), md(worst.date), best ? pct(best.ibkr) : '', best ? md(best.date) : '', pct(worst.adj), best ? pct(best.adj) : ''));
    w.push(L.whyTax2(pp(maxGap), md(gapDate), pct(minIbkrDD, 1), pct(K.mdd, 1), Math.abs(K.pending_tax) < 1 ? '' : money(-K.pending_tax, 2)));
  }
  if (wdEv.length) {
    const e = wdEv[wdEv.length - 1];
    const i = S.dates.indexOf(e.date);
    const navBefore = i > 0 ? S.nav[i - 1] : null;
    const paidIn = (K.start_value || 0) + K.total_in;
    const example = navBefore != null && paidIn > 0
      ? L.whyWdEx(K.pre_existing ? L.paidStart : L.paidDep, money(navBefore), money(paidIn), pct(navBefore / paidIn - 1, 1), money(e.nav), pct(e.nav / paidIn - 1, 1)) : '';
    w.push(L.whyWdP(taxEv.length ? '2. ' : '', md(e.date), money(-e.amount), pct(e.ibkr), pct(e.adj), example));
  }
  document.getElementById('why').innerHTML = w.join('');
  if (!hasTax) {
    document.getElementById('whyGrid').style.gridTemplateColumns = '1fr';
    document.getElementById('whyTitle').textContent = L.whyWd;
  }
  if (!hasTax && !wdEv.length) { document.getElementById('whySec').style.display = 'none'; return; }

  document.getElementById('tEv').innerHTML = `<tr>${L.evCols.map((c, j) => `<th${j < 2 ? ' class="l"' : ''}>${c}</th>`).join('')}</tr>` +
    ev.map(e => `<tr><td class="l">${e.date}</td><td class="l"><span class="tag ${evTag(e.kind)}">${evName(e.kind)}</span></td><td class="${cls(e.amount)}">${money(e.amount, 2, true)}</td><td class="${cls(e.ibkr)}">${pct(e.ibkr)}</td><td class="${cls(e.adj)}">${pct(e.adj)}</td><td>${money(e.nav)}</td></tr>`).join('');
})();

/* ---------- tables ---------- */
(function () {
  const heat = v => {
    if (v == null) return '';
    const a = Math.min(Math.abs(v) / 0.12, 1) * 0.55 + 0.06;
    return `background:${v >= 0 ? `rgba(19,154,74,${a})` : `rgba(217,45,45,${a})`}`;
  };
  const MC = L.monCols;
  const has = s => D.months.some(r => r[s] != null);
  const cols = [['account', MC.account]].concat(hasTax ? [['ibkr', MC.ibkr]] : []).concat(has('SPY') ? [['SPY', 'SPY']] : []).concat(has('QQQ') ? [['QQQ', 'QQQ']] : []);
  let h = `<tr><th class="l">${MC.m}</th>${cols.map(c => `<th>${c[1]}</th>`).join('')}${has('SPY') ? `<th>${MC.ex}</th>` : ''}</tr>`;
  const prod = k => D.months.reduce((a, r) => a * (1 + (r[k] ?? 0)), 1) - 1;
  h += D.months.map(r => `<tr><td class="l">${r.m}</td>${cols.map(c => `<td style="${c[0] === 'account' ? heat(r[c[0]]) : ''}">${pct(r[c[0]])}</td>`).join('')}${has('SPY') ? `<td class="${cls(r.account - r.SPY)}">${r.SPY != null ? pp(r.account - r.SPY) : '—'}</td>` : ''}</tr>`).join('');
  h += `<tr style="font-weight:650"><td class="l">${MC.total}</td>${cols.map(c => `<td>${pct(prod(c[0]))}</td>`).join('')}${has('SPY') ? `<td class="${cls(prod('account') - prod('SPY'))}">${pp(prod('account') - prod('SPY'))}</td>` : ''}</tr>`;
  document.getElementById('tMon').innerHTML = h;

  document.getElementById('tPos').innerHTML = `<tr>${L.posCols.map((c, j) => `<th${j < 3 ? ' class="l"' : ''}>${c}</th>`).join('')}</tr>` +
    (D.positions.length ? D.positions.map(p => `<tr><td class="l"><b>${p.symbol}</b></td><td class="l dim">${(p.desc || '').slice(0, 28)}</td><td class="l"><span class="tag ${p.qty > 0 ? 't-in' : 't-out'}">${p.qty > 0 ? L.long : L.short}</span></td><td>${p.qty.toLocaleString()}</td><td>${num(p.avg)}</td><td>${num(p.mark)}</td><td>${money(p.value)}</td><td>${pct(p.value / K.nav, 1, false)}</td><td class="${cls(p.upnl)}">${money(p.upnl, 0, true)}</td><td class="${cls(p.upnl)}">${pct(p.upnl / Math.abs(p.cost || 1), 1)}</td></tr>`).join('')
      : `<tr><td class="l dim" colspan="10">${L.noPos}</td></tr>`);

  (function () {   // composition: long and short market value by asset class, as % of NAV
    const el = document.getElementById('comp');
    const ps = D.positions.filter(p => p.value);
    if (!ps.length || !K.nav) { el.style.display = 'none'; return; }
    const keyOf = p => p.cat === 'STK' ? (p.sub === 'ETF' ? 'etf' : 'stk') : (p.cat === 'OPT' ? 'opt' : 'oth');
    const col = {stk: '#1f5eff', etf: '#7c4dff', opt: '#e8a317', oth: '#9aa3b5'};
    const order = ['stk', 'etf', 'opt', 'oth'];
    const sum = side => { const o = {}; ps.forEach(p => { if (side * p.value > 0) { const k = keyOf(p); o[k] = (o[k] || 0) + Math.abs(p.value) / K.nav; } }); return o; };
    const L1 = sum(1), S1 = sum(-1);
    const tot = o => Object.values(o).reduce((a, b) => a + b, 0);
    const scale = Math.max(1, tot(L1), tot(S1));
    const row = (lab, o) => tot(o) ? `<div class="r"><span class="k">${lab}</span><div class="bar">${order.filter(k => o[k]).map(k => `<span title="${L.compCls[k]} ${pct(o[k], 1, false)}" style="width:${o[k] / scale * 100}%;background:${col[k]}"></span>`).join('')}</div><span class="v">${pct(tot(o), 0, false)}</span></div>` : '';
    const used = order.filter(k => L1[k] || S1[k]);
    const lg = used.map(k => `<span><i style="background:${col[k]}"></i>${L.compCls[k]} ${[L1[k] ? `${L.compLong} ${pct(L1[k], 0, false)}` : '', S1[k] ? `${L.compShort} ${pct(S1[k], 0, false)}` : ''].filter(Boolean).join(' · ')}</span>`).join('');
    el.innerHTML = `<div class="t">${L.comp}</div>${row(L.compLong, L1)}${row(L.compShort, S1)}<div class="lg">${lg}</div>` +
      (used.includes('opt') ? `<div class="lg">${L.compOpt}</div>` : '');
  })();

  document.getElementById('tSym').innerHTML = `<tr>${L.symCols.map((c, j) => `<th${j ? '' : ' class="l"'}>${c}</th>`).join('')}</tr>` +
    syms.map(s => `<tr><td class="l"><b>${s.symbol}</b></td><td class="${cls(s.realized)}">${money(s.realized, 0, true)}</td><td class="${s.unrealized ? cls(s.unrealized) : 'dim'}">${s.unrealized ? money(s.unrealized, 0, true) : '—'}</td><td class="${s.div ? cls(s.div) : 'dim'}">${s.div ? money(s.div, 0, true) : '—'}</td><td class="${cls(s.total)}"><b>${money(s.total, 0, true)}</b></td><td>${s.n_exec}</td><td>${money(s.turnover)}</td><td>${money(s.comm, 0)}</td></tr>`).join('');

  document.getElementById('tchips').innerHTML = L.tchips(T, pct(Math.abs(T.commissions) / Math.abs(K.pnl || 1), 1, false))
    .map(c => `<div class="chip"><div class="lab">${c[0]}</div><div class="val">${c[1]}</div><div class="lab">${c[2]}</div></div>`).join('');
  const row = c => `<tr><td class="l">${c.tradeDate.slice(0, 4)}-${c.tradeDate.slice(4, 6)}-${c.tradeDate.slice(6)}</td><td class="l"><b>${c.u}</b></td><td class="l"><span class="tag ${c.side === 'long' ? 't-in' : 't-out'}">${c.side === 'long' ? L.closeLong : L.coverShort}</span></td><td class="${cls(c.pnl)}">${money(c.pnl, 0, true)}</td></tr>`;
  document.getElementById('tWin').innerHTML = D.top_win.map(row).join('') || `<tr><td class="l dim">${L.none}</td></tr>`;
  document.getElementById('tLoss').innerHTML = D.top_loss.map(row).join('') || `<tr><td class="l dim">${L.none}</td></tr>`;

  const F = D.fees, order = ['Dividends', 'Interest received', 'Withholding tax (dividends / interest)', 'Commissions', 'Margin interest', 'Borrow fees', 'Transaction tax (not refunded)', 'Other fees', 'Temp. withholding not yet refunded'];
  let fsum = 0;
  document.getElementById('tFee').innerHTML = `<tr><th class="l">${L.feeCols[0]}</th><th>${L.feeCols[1]}</th><th>${L.feeCols[2]}</th></tr>` +
    order.filter(k => F[k] != null && Math.abs(F[k]) > 0.005).map(k => { fsum += F[k]; return `<tr><td class="l">${L.feeName[k] || k}</td><td class="${cls(F[k])}">${money(F[k], 2, true)}</td><td class="dim">${pct(F[k] / K.pnl, 2)}</td></tr>`; }).join('') +
    `<tr style="font-weight:650"><td class="l">${L.total}</td><td class="${cls(fsum)}">${money(fsum, 2, true)}</td><td class="dim">${pct(fsum / K.pnl, 2)}</td></tr>`;
})();

/* ---------- charts ---------- */
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.size = 12;
Chart.defaults.color = '#6b7385';
Chart.defaults.borderColor = '#eceef2';
Chart.defaults.plugins.legend.labels.boxWidth = 14;
Chart.defaults.plugins.legend.labels.boxHeight = 3;
Chart.defaults.animation = false;
const pctAxis = {ticks: {callback: v => (v * 100).toFixed(0) + '%'}};
const moneyAxis = {ticks: {callback: v => (v < 0 ? '-' : '') + CCY + (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(0) + 'k' : Math.abs(v))}};
const xAxis = {grid: {display: false}, ticks: {maxTicksLimit: 9, maxRotation: 0, callback(v) { return md(this.getLabelForValue(v)); }}};
const line = (label, data, color, extra = {}) => Object.assign({label, data, borderColor: color, backgroundColor: color, borderWidth: 1.8, pointRadius: 0, pointHoverRadius: 3, tension: 0.15, spanGaps: true}, extra);
const evColor = k => k === EV_WD ? '#d92d2d' : (k === EV_DEP ? '#139a4a' : '#7c4dff');

/* main chart */
let mainChart;
function startIdx(r) {
  if (r === 'all') return 0;
  const last = new Date(S.dates[N - 1]);
  let t = new Date(last);
  if (r === '3m') t.setMonth(t.getMonth() - 3);
  else if (r === '1m') t.setMonth(t.getMonth() - 1);
  else if (r === 'ytd') t = new Date(last.getFullYear(), 0, 1);
  const i = S.dates.findIndex(d => new Date(d) >= t);
  return Math.max(0, i - 1);
}
function drawMain(r) {
  const i0 = startIdx(r);
  const rb = a => a.slice(i0).map(v => v == null ? null : (1 + v) / (1 + (a[i0] ?? 0)) - 1);
  const labels = S.dates.slice(i0);
  const adj = rb(S.adj);
  const pnlR = S.pnl.slice(i0).map(v => v == null ? null : v - (S.pnl[i0] ?? 0));   // P&L within the selected range
  const n = labels.length - 1;
  document.getElementById('rngSum').innerHTML = L.rngSum(md(labels[0]), md(labels[n]), `<b class="${cls(adj[n])}">${pct(adj[n])}</b>`, `<b class="${cls(pnlR[n])}">${money(pnlR[n], 0, true)}</b>`,
    hasB('SPY') ? pct(rb(S.SPY)[n]) : '', hasB('QQQ') ? pct(rb(S.QQQ)[n]) : '');
  const evMap = {};
  ev.forEach(e => { (evMap[e.date] = evMap[e.date] || []).push(e); });
  const evData = labels.map((d, i) => evMap[d] ? adj[i] : null);
  const evCols = labels.map(d => evMap[d] ? evColor(evMap[d][0].kind) : 'transparent');
  const ds = [
    line(L.myAcct, adj, '#1f5eff', {borderWidth: 2.6, order: 1}),
    line(L.ibkrRaw, rb(S.ibkr), '#a3abbd', {borderDash: [5, 4], borderWidth: 1.6, order: 3, hidden: !hasTax}),
  ];
  if (hasB('SPY')) ds.push(line('SPY', rb(S.SPY), '#f08c2e', {order: 2}));
  if (hasB('QQQ')) ds.push(line('QQQ', rb(S.QQQ), '#16a06a', {order: 2}));
  ds.push({label: L.events, data: evData, showLine: false, pointStyle: 'triangle', pointRadius: 7, pointHoverRadius: 9, pointBackgroundColor: evCols, pointBorderColor: '#fff', pointBorderWidth: 1, borderColor: 'transparent', backgroundColor: '#7c4dff', order: 0});
  if (mainChart) mainChart.destroy();
  mainChart = new Chart(document.getElementById('cMain'), {
    type: 'line', data: {labels, datasets: ds},
    options: {
      maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
      scales: {x: xAxis, y: pctAxis},
      plugins: {
        legend: {position: 'top', align: 'start', labels: {filter: it => it.text !== L.events}},
        tooltip: {callbacks: {
          label: c => {
            if (c.dataset.label === L.events) { const es = evMap[c.label] || []; return es.map(e => `${evName(e.kind)} ${money(e.amount, 0, true)}`); }
            if (c.datasetIndex === 0) return L.tipPnl(c.dataset.label, pct(c.raw), money(pnlR[c.dataIndex], 0, true));
            return `${c.dataset.label}: ${pct(c.raw)}`;
          }
        }}
      }
    }
  });
}
drawMain('all');
document.querySelectorAll('#rng button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#rng button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); drawMain(b.dataset.r);
});

/* daily returns calendar */
(function () {
  const byDate = {};
  S.dates.forEach((d, i) => { if (i > 0) byDate[d] = {r: S.r_adj[i], p: S.pnl_day[i]}; });
  const first = S.dates[Math.min(1, N - 1)], last = S.dates[N - 1];
  const months = [];
  let y = +first.slice(0, 4), m = +first.slice(5, 7);
  const ly = +last.slice(0, 4), lm = +last.slice(5, 7);
  while (y < ly || (y === ly && m <= lm)) { months.push([y, m]); m++; if (m > 12) { m = 1; y++; } }
  let k = months.length - 1;
  const heat = v => { const a = Math.min(Math.abs(v) / 0.04, 1) * 0.45 + 0.08; return v >= 0 ? `rgba(19,154,74,${a})` : `rgba(217,45,45,${a})`; };
  const pad = x => String(x).padStart(2, '0');
  function render() {
    const [yy, mm] = months[k];
    document.getElementById('calYm').textContent = L.calYm(yy, mm);
    document.getElementById('calPrev').disabled = k === 0;
    document.getElementById('calNext').disabled = k === months.length - 1;
    const cells = L.calDays.map(w => `<div class="h">${w}</div>`);
    const nd = new Date(yy, mm, 0).getDate();
    let started = false, comp = 1, sum = 0, cnt = 0;
    for (let dd = 1; dd <= nd; dd++) {
      const dow = new Date(yy, mm - 1, dd).getDay();
      if (dow === 0 || dow === 6) continue;
      if (!started) { for (let b = 1; b < dow; b++) cells.push('<div class="c blank"></div>'); started = true; }
      const ds = `${yy}-${pad(mm)}-${pad(dd)}`, v = byDate[ds];
      if (v && v.r != null) {
        comp *= 1 + v.r; sum += v.p || 0; cnt++;
        cells.push(`<div class="c" style="background:${heat(v.r)}"><div class="d">${dd}</div><div class="r">${pct(v.r)}</div><div class="p">${money(v.p, 0, true)}</div></div>`);
      } else if (ds > last) {
        cells.push(`<div class="c fut"><div class="d">${dd}</div></div>`);
      } else if (ds < first) {
        cells.push(`<div class="c off"><div class="d">${dd}</div></div>`);
      } else {
        cells.push(`<div class="c off"><div class="d">${dd}</div>${L.calClosed}</div>`);
      }
    }
    document.getElementById('cal').innerHTML = cells.join('');
    document.getElementById('calSum').innerHTML = cnt ? L.calSum(cnt, `<b class="${cls(comp - 1)}">${pct(comp - 1)}</b>`, `<b class="${cls(sum)}">${money(sum, 0, true)}</b>`) : L.calNone;
  }
  document.getElementById('calPrev').onclick = () => { if (k > 0) { k--; render(); } };
  document.getElementById('calNext').onclick = () => { if (k < months.length - 1) { k++; render(); } };
  render();
})();

(function () {
  const bm = T.by_month || [];
  new Chart(document.getElementById('cAct'), {data: {labels: bm.map(x => x.month), datasets: [
    {type: 'bar', label: L.execL, data: bm.map(x => x.n), backgroundColor: 'rgba(31,94,255,.45)', yAxisID: 'y', borderRadius: 4, order: 1},
    Object.assign(line(L.moneyL, bm.map(x => x.money), '#f08c2e', {borderWidth: 2, pointRadius: 3}), {type: 'line', yAxisID: 'y1', order: 0}),
  ]}, options: {maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
    scales: {x: {grid: {display: false}}, y: {title: {display: true, text: L.execUnit}}, y1: Object.assign({position: 'right', grid: {display: false}}, moneyAxis)},
    plugins: {legend: {position: 'top', align: 'start'}, tooltip: {callbacks: {label: c => c.dataset.yAxisID === 'y1' ? `${L.moneyL}: ${money(c.raw)}` : `${L.execL}: ${c.raw}`}}}}});
})();

/* ---------- risk flags and trading style ---------- */
(function () {
  const F = D.flags || [];
  document.getElementById('flags').innerHTML = F.length ? F.map(f => `<div class="flag ${f.level}"><div class="t"><span class="lv ${f.level}">${L.lv[f.level]}</span>${f.title}</div><div class="x">${f.detail}</div></div>`).join('')
    : `<div class="dim">${L.noFlags}</div>`;
  const nH = F.filter(f => f.level === 'high').length, nM = F.filter(f => f.level === 'mid').length;
  document.querySelector('#riskCard h2').insertAdjacentHTML('beforeend', `<span class="cnt">${L.riskCnt(nH, nM)}</span>`);

  const rows = D.style_rows || [], ch = D.style_changes || [];
  if (rows.length < 2) { document.getElementById('styleCard').style.display = 'none'; }
  else {
    const last = rows[rows.length - 1];
    document.getElementById('styleHint').textContent = L.styleHint(last.month, rows[0].month, rows[rows.length - 2].month) + (D.style_note ? ' · ' + D.style_note : '');
    document.getElementById('tChg').innerHTML = `<tr><th class="l">${L.styleCols[0]}</th><th>${last.month}</th><th>${L.styleCols[1]}</th><th>${L.styleCols[2]}</th></tr>` +
      ch.map(c => `<tr class="${c.big ? 'big' : ''}"><td class="l">${c.name}</td><td><b>${c.latest}</b></td><td class="dim">${c.base}</td><td>${c.delta}</td></tr>`).join('');
    const x = v => v == null ? '—' : v.toFixed(2) + '×';
    const fm = [v => pct(v, 1), v => v ?? '—', v => pct(v, 0, false), v => num(v), v => v ? money(v) : '—', v => pct(v, 0, false), v => num(v, 1), v => pct(v, 0, false), x, x, x, v => pct(v, 0, false)];
    const keys = ['ret', 'n_close', 'win_rate', 'payoff', 'max_loss', 'short_share', 'avg_hold', 'intraday', 'turnover_x', 'avg_gross', 'max_gross', 'max_pos'];
    document.getElementById('tStyle').innerHTML = `<tr>${L.styleTbl.map((c, j) => `<th${j ? '' : ' class="l"'}>${c}</th>`).join('')}</tr>` +
      rows.map(r => `<tr><td class="l">${r.month}</td>${keys.map((key, j) => `<td class="${key === 'ret' ? cls(r[key]) : (key === 'max_loss' && r[key] < 0 ? 'neg' : '')}">${fm[j](r[key])}</td>`).join('')}</tr>`).join('');
  }

  const RL = D.rolling;
  if (RL && RL.dates.length) {
    document.getElementById('rollCard').style.display = '';
    document.getElementById('rollHint').textContent = L.rollHint(RL.window);
    new Chart(document.getElementById('cRoll'), {type: 'line', data: {labels: RL.dates, datasets: [
      line(L.rollRet, RL.ret, '#1f5eff', {yAxisID: 'y', borderWidth: 2.2}),
      line(L.rollVol, RL.vol, '#f08c2e', {yAxisID: 'y'}),
      line(L.rollSh, RL.sharpe, '#16a06a', {yAxisID: 'y1', borderDash: [5, 4]}),
    ]}, options: {maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
      scales: {x: xAxis, y: pctAxis, y1: {position: 'right', grid: {display: false}}},
      plugins: {legend: {position: 'top', align: 'start'}, tooltip: {callbacks: {label: c => c.dataset.yAxisID === 'y1' ? `${c.dataset.label}: ${num(c.raw)}` : `${c.dataset.label}: ${pct(c.raw, 1)}`}}}}});
  }
})();
</script>
</body>
</html>
